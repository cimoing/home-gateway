services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-gateway:local
    restart: unless-stopped
    init: true
    environment:
      DATA: /data
      DB_DRIVER: sqlite
      SESSION_SECURE: "false"
      # SMB_PASSWORD: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # CF_API_TOKEN: ""
      # TRANSMISSION_RPC_PASSWORD: ""
    ports:
      - "${APP_PORT:-8080}:8080"
      # Peer ports for bt.engine=anacrolix. When using profile "transmission",
      # comment these out and publish BT_PORT on the transmission service instead.
      - "${BT_PORT:-42069}:42069/tcp"
      - "${BT_PORT:-42069}:42069/udp"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DATA_DIR:-./data}:/data
    networks:
      - default
    stop_grace_period: 30s

  # Optional: docker compose --profile transmission up -d --build
  # Requires config bt.engine=transmission and matching RPC URL, e.g.
  #   transmission.url: http://transmission:9091/transmission/rpc
  # App and daemon share DATA so EngineDir paths (e.g. /data/bt/downloads) match.
  transmission:
    profiles: ["transmission"]
    image: linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      PEERPORT: ${BT_PORT:-42069}
      # USER: ""
      # PASS: ${TRANSMISSION_RPC_PASSWORD:-}
    ports:
      - "${BT_PORT:-42069}:${BT_PORT:-42069}/tcp"
      - "${BT_PORT:-42069}:${BT_PORT:-42069}/udp"
      - "${TRANSMISSION_RPC_PORT:-9091}:9091"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${TRANSMISSION_CONFIG_DIR:-./data/transmission}:/config
    networks:
      - default

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
        - subnet: fd00:c0:ffee:1::/64
          gateway: fd00:c0:ffee:1::1
