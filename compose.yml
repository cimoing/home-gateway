services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-gateway:local
    restart: unless-stopped
    init: true
    environment:
      DATA: /data
      DB_DRIVER: sqlite
      SESSION_SECURE: "false"
      # SMB_PASSWORD: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # CF_API_TOKEN: ""
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DATA_DIR:-./data}:/data
    networks:
      - default
    stop_grace_period: 30s

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
        - subnet: fd00:c0:ffee:1::/64
          gateway: fd00:c0:ffee:1::1
