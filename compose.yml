services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-gateway:local
    restart: unless-stopped
    init: true
    environment:
      DB_DRIVER: sqlite
      DB_DSN: /data/home-gateway.db
      SESSION_SECURE: "false"
      # SMB_PASSWORD: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # CF_API_TOKEN: ""
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${BT_PORT:-42069}:42069/tcp"
      - "${BT_PORT:-42069}:42069/udp"
    volumes:
      - app-data:/data
    stop_grace_period: 30s

volumes:
  app-data:
