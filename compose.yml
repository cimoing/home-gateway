services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-gateway:local
    restart: unless-stopped
    init: true
    environment:
      DATA: /data
      DB_DRIVER: sqlite
      SESSION_SECURE: "false"
      # SMB_PASSWORD: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # CF_API_TOKEN: ""
      # TRANSMISSION_RPC_PASSWORD: ""
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DATA_DIR:-./data}:/data
      # Fast path on Raspberry Pi: mount NAS with kernel CIFS on the host, then
      # bind-mount it and use storage backend type: local (not type: smb).
      # Example host mount:
      #   mount -t cifs //192.168.1.10/media /mnt/nas \
      #     -o credentials=/root/.smbcredentials,vers=3.1.1,cache=strict,rsize=1048576,wsize=1048576
      # - /mnt/nas:/mnt/nas:rw
    # Optional on Pi for less Docker NAT overhead (conflicts with published ports mapping style):
    # network_mode: host
    networks:
      - default
    stop_grace_period: 30s

  # Optional remote BT engine. Enable with: docker compose --profile transmission up -d
  # Then set bt.enable: true and bt.transmission.url: http://transmission:9091/transmission/rpc
  transmission:
    profiles: ["transmission"]
    image: linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Shanghai
      USER: "${TRANSMISSION_RPC_USER:-}"
      PASS: "${TRANSMISSION_RPC_PASSWORD:-}"
      PEERPORT: "${BT_PEER_PORT:-51413}"
    ports:
      - "${BT_PEER_PORT:-51413}:${BT_PEER_PORT:-51413}"
      - "${BT_PEER_PORT:-51413}:${BT_PEER_PORT:-51413}/udp"
      - "127.0.0.1:${TRANSMISSION_RPC_PORT:-9091}:9091"
    volumes:
      - ${DATA_DIR:-./data}/transmission/config:/config
      - ${DATA_DIR:-./data}/downloads:/downloads
    networks:
      - default

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
        - subnet: fd00:c0:ffee:1::/64
          gateway: fd00:c0:ffee:1::1
