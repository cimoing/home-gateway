services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: home-gateway:local
    restart: unless-stopped
    init: true
    environment:
      DB_DRIVER: postgres
      DB_DSN: postgres://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gateway}?sslmode=disable
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      SESSION_SECURE: "false"
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${BT_PORT:-42069}:42069/tcp"
      - "${BT_PORT:-42069}:42069/udp"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  postgres-data:
  app-data:
