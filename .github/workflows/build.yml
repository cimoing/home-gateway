name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.25.7"
  NODE_VERSION: "24"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go tests
        run: go test ./... -count=1

      - name: Build web
        run: |
          npm --prefix web ci
          npm --prefix web run build

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and embed web assets
        run: |
          npm --prefix web ci
          npm --prefix web run build
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -a web/dist/. internal/webui/dist/

      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "dist/home-gateway-${{ matrix.name }}"
          go build -trimpath -ldflags="-s -w" \
            -o "dist/home-gateway-${{ matrix.name }}/home-gateway" \
            ./cmd/server

      - name: Package release archive
        run: |
          set -euo pipefail
          name="home-gateway-${{ matrix.name }}"
          staging="dist/${name}"
          cp config.example.yaml "${staging}/"
          cat > "${staging}/README.txt" <<'EOF'
          Home Gateway release package

          The web UI is embedded in the binary.

          Run:
            export DATA=./data
            ./home-gateway run

          Config defaults to /config/config.yaml; for local use:
            ./home-gateway run --config ./config.yaml
          EOF
          (cd dist && zip -r "${name}.zip" "${name}")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: home-gateway-${{ matrix.name }}
          path: dist/home-gateway-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: home-gateway-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
