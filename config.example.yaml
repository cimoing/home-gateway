bt:
  enabled: true
  # Engine: anacrolix (embedded, default) or transmission (RPC to transmission-daemon).
  # engine: anacrolix
  # When engine=transmission, peer listen port and download root are applied via RPC.
  # transmission:
  #   url: http://127.0.0.1:9091/transmission/rpc
  #   # Docker Compose profile: http://transmission:9091/transmission/rpc
  #   username: ""
  #   password: ${TRANSMISSION_RPC_PASSWORD}
  # Optional default storage backend name from storage.backends.
  # Empty = local filesystem at download_dir.
  # storage_backend: local
  # When storage_backend is set, download_dir is a relative path on that backend.
  # When unset, download_dir is a local filesystem path.
  # Relative to the DATA directory (default "." / container "/data").
  download_dir: bt/downloads
  listen_port: 42069
  # 0 = unlimited. Accepts bytes/s or human rates: 512K, 10M, 1G (binary units).
  download_limit_bps: 0
  upload_limit_bps: 0
  # 0 = disabled; pause seeding when share ratio reaches this value
  seed_ratio_limit: 0
  # complete = sync after whole task finishes; per_file = sync each file when ready
  sync_strategy: complete
  # max concurrent uploads while syncing to remote storage
  sync_concurrency: 2
  # Peer blocklist (hot-reloadable via POST /api/system/reload-config)
  # With engine=transmission, client/peer-id/port rules are not enforced by the daemon;
  # IP/CIDR denial needs Transmission's own blocklist.
  block:
    clients: []
    # clients:
    #   - Xunlei
    #   - XL
    #   - qBittorrent
    peer_ids: []
    # peer_ids:
    #   - "-qB4500-........"
    ports: []
    # ports:
    #   - 6881
    networks: []
    # networks:
    #   - 203.0.113.0/24
    #   - 198.51.100.10

storage:
  backends:
    - name: local
      type: local
      config:
        root: bt/downloads
