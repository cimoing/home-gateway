bt:
  enabled: true
  download_dir: /data/downloads
  listen_port: 42069
  # 0 = unlimited (bytes per second)
  download_limit_bps: 0
  upload_limit_bps: 0
  # 0 = disabled; pause seeding when share ratio reaches this value
  seed_ratio_limit: 0
  # complete = sync after whole task finishes; per_file = sync each file when ready
  sync_strategy: complete
  # max concurrent uploads while syncing to remote storage
  sync_concurrency: 2

storage:
  backends:
    - name: local
      type: local
      config:
        root: /data/downloads
